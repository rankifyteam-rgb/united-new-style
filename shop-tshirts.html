<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop T-Shirts | United New Style</title>
<meta name="description" content="Shop premium T-Shirts from United New Style — heavyweight cotton tees built for everyday comfort and a lasting fit." />
<link rel="canonical" href="https://www.unitednewstyle.com/shop-tshirts.html" />
<link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="shop">
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header" id="site-header"></header>

<main id="main-content">
  <section class="collection-banner">
    <div class="container">
      <div class="breadcrumbs"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <span>T-Shirts</span></div>
      <h1>T-Shirts</h1>
      <p>Heavyweight, premium cotton tees built for everyday comfort — cut to hold their shape wash after wash.</p>
    </div>
  </section>

  <div class="container">
    <div class="collection-toolbar">
      <span class="toolbar-count" id="toolbar-count">Showing products</span>
      <div class="toolbar-actions">
        <button type="button" class="filter-toggle-mobile" id="filter-toggle-mobile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="1.6" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.6" fill="currentColor" stroke="none"/></svg>
          Filter
        </button>
        <div class="select-wrap">
          <select id="sort-select" aria-label="Sort products">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="newest">Newest</option>
            <option value="rating">Top Rated</option>
          </select>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
    </div>

    <div class="collection-layout">
      <aside class="filter-sidebar" id="filter-sidebar">
        <div class="filter-sidebar-header">
          <h3 style="font-size:1.1rem;">Filters</h3>
          <button type="button" data-close-filter aria-label="Close filters">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="20" height="20"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
          </button>
        </div>
        <div class="filter-sidebar-scroll">
          <div class="filter-group">
            <h4>Price</h4>
            <label class="filter-option"><input type="checkbox" data-filter-price="0-50" /> Under $50</label>
            <label class="filter-option"><input type="checkbox" data-filter-price="50-100" /> $50 &ndash; $100</label>
          </div>
          <div class="filter-group">
            <h4>Size</h4>
            <div class="filter-sizes">
              <button type="button" class="size-chip" data-filter-size="S">S</button>
              <button type="button" class="size-chip" data-filter-size="M">M</button>
              <button type="button" class="size-chip" data-filter-size="L">L</button>
              <button type="button" class="size-chip" data-filter-size="XL">XL</button>
              <button type="button" class="size-chip" data-filter-size="XXL">XXL</button>
            </div>
          </div>
          <button type="button" class="filter-clear" id="filter-clear">Clear all filters</button>
        </div>
        <div class="filter-sidebar-footer">
          <button type="button" class="btn btn-navy btn-block" data-close-filter>Show Results</button>
        </div>
      </aside>

      <div class="product-grid" id="collection-grid">
        <!-- Rendered by js/pages/collection.js from js/data/products.js -->
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
  import { mountPartials } from './js/partials.js';
  import { initUI } from './js/ui.js';
  import { initCollection } from './js/pages/collection.js';

  mountPartials({ active: 'shop' });
  initUI();
  initCollection({ category: 'tshirts' });
</script>
</body>
</html>
